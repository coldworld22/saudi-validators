name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Tests, 90% line / 85% branch coverage gate, sources and Javadoc jars.
      - run: mvn -B -ntp verify
      - name: Coverage summary
        if: matrix.java == 21
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          def pct(kind):
              missed = sum(int(r[f"{kind}_MISSED"]) for r in rows)
              covered = sum(int(r[f"{kind}_COVERED"]) for r in rows)
              return 100 * covered / (missed + covered)
          print(f"### Coverage\n\n| Lines | Branches |\n|---|---|\n| {pct('LINE'):.1f}% | {pct('BRANCH'):.1f}% |")
          EOF
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports
            target/site/jacoco
